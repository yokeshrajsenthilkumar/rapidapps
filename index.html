<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Product Manager</h1>
    <p class="note">Create, view and edit products. Products can't be deleted.</p>

    <form id="item-form">
      <h2 id="form-title">Add Product</h2>
      <input type="hidden" id="item-id">
      <label>Name <input id="name" required></label>
      <label>Price <input id="price" type="number" min="0" step="0.01" required></label>
      <label>Quantity <input id="quantity" type="number" min="0" step="1" required></label>
      <div class="actions">
        <button type="submit" id="submit-btn">Add</button>
        <button type="button" id="cancel-btn" hidden>Cancel</button>
      </div>
      <p id="error" class="error"></p>
    </form>

    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>Price</th><th>Quantity</th><th></th></tr>
      </thead>
      <tbody id="items"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
